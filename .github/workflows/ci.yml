name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build chalo library
        run: npm run build:chalo
        
      - name: Run tests
        run: npm test -w packages/chalo -- --run
        
      - name: Run linter
        run: npm run lint -w packages/chalo
        
      - name: Check formatting
        run: npm run format -w packages/chalo

  build-demo:
    runs-on: ubuntu-latest
    needs: quality
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - run: npm ci
      - run: npm run build:demo
