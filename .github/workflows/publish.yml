name: Publish to npm

on:
  release:
    types: [published]

permissions:
  id-token: write  # OIDC Trusted Publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build chalo library
        run: npm run build:chalo
        
      - name: Run tests
        run: npm test -w packages/chalo -- --run
        
      - name: Publish to npm
        working-directory: packages/chalo
        run: npm publish --provenance --access public
